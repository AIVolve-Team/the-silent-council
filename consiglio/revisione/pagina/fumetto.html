<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic strip · Consiglio silenzioso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* La vista a fumetti del Consiglio: una revisione raccontata vignetta per vignetta. Ogni cosa disegnata è un dato
   della revisione: le nuvolette sono le note che gli esperti scrivono per la persona (non passano agli altri), i fili
   fra le vignette sono le memorie consegnate (in telepatia) o le lettere (a testo), con l'impronta del messaggio; il
   relatore riceve tutto e scrive il verdetto; gli esperti che non sono d'accordo intervengono. Il cronometro confronta
   le due modalità sullo stesso contratto. Stessi caratteri e colori della casa per i giudici. */
:root {
  --carta: #f6f7f9; --foglio: #ffffff; --inchiostro: #151a30; --tenue: #565d70; --linea: #dcdfe6;
  --accento: #087a6d; --accento-tenue: #ddf3ef;
  --legale: #2f62c8; --finanza: #12a594; --rischio: #7458d6; --relatore: #151a30; --corna: #c2271c;
  --viso: #ffffff; --tratto: #151a30; --disegno: #151a30;
  --didascalia: #fff3c4; --didascalia-bordo: #151a30;
  --firmare: #1f7a4d; --negoziare: #8a5208; --rifiutare: #b42318; --grave: #b42318; --grave-tenue: #fde7e4;
  --pagina: "Archivo", "Segoe UI", system-ui, sans-serif;
  --contratto: "Source Serif 4", Georgia, serif;
  --codice: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #0e1324; --foglio: #161c31; --inchiostro: #e8ebf4; --tenue: #a4aabb; --linea: #2b3350;
    --accento: #4fd1bf; --accento-tenue: #123833; --legale: #7aa2f2; --finanza: #35c2ae; --rischio: #a893f2; --relatore: #3a4466; --corna: #f08a7f;
    --viso: #f3eee6; --tratto: #d9deea; --disegno: #151a30; --didascalia: #3b3416; --didascalia-bordo: #e6d58a;
    --firmare: #5bc48e; --negoziare: #e6b35e; --rifiutare: #f08a7f; --grave: #f08a7f; --grave-tenue: #3a1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #0e1324; --foglio: #161c31; --inchiostro: #e8ebf4; --tenue: #a4aabb; --linea: #2b3350;
  --accento: #4fd1bf; --accento-tenue: #123833; --legale: #7aa2f2; --finanza: #35c2ae; --rischio: #a893f2; --relatore: #3a4466; --corna: #f08a7f;
  --viso: #f3eee6; --tratto: #d9deea; --disegno: #151a30; --didascalia: #3b3416; --didascalia-bordo: #e6d58a;
  --firmare: #5bc48e; --negoziare: #e6b35e; --rifiutare: #f08a7f; --grave: #f08a7f; --grave-tenue: #3a1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 400 1rem/1.55 var(--pagina); font-variation-settings: "wdth" 100; padding: 20px 16px 72px; }
.foglio { max-width: 1120px; margin-inline: auto; display: grid; gap: 28px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); font-weight: 820; line-height: 1.08; letter-spacing: -0.02em; font-variation-settings: "wdth" 108; overflow-wrap: anywhere; text-wrap: balance; }
h2 { font-size: 1.15rem; font-weight: 740; line-height: 1.2; font-variation-settings: "wdth" 106; }
a { color: inherit; text-underline-offset: 0.18em; }
button { font: inherit; color: inherit; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accento); outline-offset: 3px; border-radius: 4px; }
.tenue { color: var(--tenue); }

/* barra in cima */
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.barra > a { font-weight: 600; font-size: 0.9375rem; text-decoration: none; }
.scelte { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; padding: 2px; background: var(--foglio); }
.scelte button { border: 0; background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 0.875rem; }
.scelte button[aria-pressed="true"] { background: var(--inchiostro); color: var(--foglio); }
.scelte button:disabled { opacity: 0.45; cursor: not-allowed; }
.scelte.modi button { padding: 6px 14px; font-size: 0.9375rem; font-weight: 600; }
.scelte.modi button[data-modo="telepatia"][aria-pressed="true"] { background: var(--accento); color: var(--foglio); }

/* intestazione: titolo a sinistra, cronometro accanto */
.testa { display: grid; gap: 20px 32px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .testa { grid-template-columns: minmax(0, 1fr) auto; } }
.titoli { display: grid; gap: 12px; align-content: start; }
.sotto { font-size: clamp(1.02rem, 1.6vw, 1.15rem); color: var(--tenue); max-width: 40rem; }
.legenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9375rem; max-width: 44rem; }
.legenda li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; }
.legenda svg { width: 34px; height: 22px; }

/* il cronometro: le due modalità sullo stesso contratto, coi tempi e i token misurati */
.cronometro { background: var(--foglio); border: 2.5px solid var(--tratto); border-radius: 4px; padding: 14px 16px 16px; display: grid; gap: 12px; box-shadow: 5px 5px 0 var(--tratto); max-width: 420px; }
.quadranti { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.quadrante { display: grid; justify-items: center; gap: 2px; text-align: center; position: relative; }
.quadrante svg { width: 112px; height: 124px; overflow: visible; }
.quadrante .nome { font-weight: 700; font-size: 0.9375rem; line-height: 1.2; }
.quadrante.memoria .nome { color: var(--accento); }
.quadrante .ore { font-weight: 820; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.quadrante .token { font-size: 0.875rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
.quadrante .fatto { position: absolute; top: 34px; left: 50%; transform: translateX(-50%) rotate(-8deg); border: 2.5px solid var(--firmare); color: var(--firmare); background: var(--foglio); font-weight: 850; font-size: 0.8125rem; padding: 1px 7px; border-radius: 3px; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
.quadrante.finito .fatto { opacity: 1; }
.cronometro .frase { font-size: 0.9375rem; }
.cronometro .frase b { font-variant-numeric: tabular-nums; }
.cronometro .avvia { justify-self: start; border: 2px solid var(--tratto); background: var(--inchiostro); color: var(--foglio); border-radius: 6px; padding: 7px 14px; font-weight: 700; }

/* la striscia: vignette con il bordo d'inchiostro, i fili della memoria negli spazi fra l'una e l'altra */
.striscia { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.vignetta { background: var(--foglio); border: 2.5px solid var(--tratto); border-radius: 3px; padding: 14px; display: grid; gap: 12px; min-width: 0; position: relative; }
.didascalia { background: var(--didascalia); border: 2px solid var(--didascalia-bordo); padding: 7px 10px; font-size: 0.9375rem; line-height: 1.4; font-weight: 500; justify-self: start; max-width: 100%; }
.didascalia b { font-weight: 750; }
.didascalia .n { font-weight: 850; margin-right: 6px; font-variant-numeric: tabular-nums; }

.vignetta.contratto { gap: 14px; }
.vignetta.contratto .riga-titolo { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.barra-contratto { display: flex; height: 26px; border: 2px solid var(--tratto); border-radius: 2px; overflow: hidden; }
.barra-contratto span { min-width: 6px; border-right: 2px solid var(--tratto); }
.barra-contratto span:last-child { border-right: 0; }
.parti { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.9375rem; }
.parti span { display: inline-flex; gap: 7px; align-items: center; font-variant-numeric: tabular-nums; }
.parti i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--tratto); flex: none; }

.vignetta.esperto { grid-template-rows: auto 1fr auto; }
.personaggio { width: 112px; height: 122px; display: block; }
.personaggio-riga { display: flex; align-items: flex-end; gap: 10px; }
.personaggio-riga .chi { font-weight: 800; font-size: 0.9375rem; font-variation-settings: "wdth" 90; padding-bottom: 6px; color: var(--c); }

/* le nuvolette: lettering condensato come nei fumetti, la coda punta al personaggio */
.nuvola { position: relative; background: var(--foglio); border: 2.5px solid var(--tratto); border-radius: 20px; padding: 12px 14px; font-weight: 600; font-variation-settings: "wdth" 86; font-size: 1rem; line-height: 1.38; align-self: end; display: grid; gap: 8px; margin-bottom: 14px; }
.nuvola::after { content: ""; position: absolute; left: 40px; bottom: -16px; width: 22px; height: 16px; background: var(--foglio); border-right: 2.5px solid var(--tratto); border-bottom: 2.5px solid var(--tratto); transform: skewX(-38deg); border-bottom-right-radius: 4px; }
.nuvola ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.nuvola .cat { font-weight: 800; }
.nuvola q { display: block; quotes: "“" "”"; font: 400 0.9375rem/1.45 var(--contratto); font-variation-settings: normal; margin-top: 2px; overflow-wrap: anywhere; }
.nuvola .segno { font: 700 0.75rem/1 var(--pagina); color: var(--firmare); margin-left: 4px; white-space: nowrap; }
.nuvola .segno.no { color: var(--rifiutare); }
.nuvola .altre { font-size: 0.875rem; font-weight: 500; color: var(--tenue); }
.nuvola.vuota { color: var(--tenue); }

/* il passaggio fra due vignette: in telepatia i fili delle memorie (uno per mittente), a testo le lettere */
.passaggio { display: grid; place-items: center; align-content: center; gap: 4px; padding: 10px 0; min-height: 76px; text-align: center; }
.fili { display: flex; flex-direction: row; gap: 5px; height: 44px; position: relative; }
.fili i { width: 6px; height: 100%; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1.5px var(--tratto); }
.fili::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 7px solid transparent; border-top: 9px solid var(--tratto); border-bottom: 0; }
.lettere { display: flex; gap: 0; height: 40px; align-items: center; }
.lettere svg { width: 34px; height: 24px; margin-left: -10px; }
.lettere svg:first-child { margin-left: 0; }
.passaggio .cosa { font-size: 0.8125rem; font-weight: 700; color: var(--accento); margin-top: 6px; }
.passaggio.testo .cosa { color: var(--tenue); }
.impronta { font: 0.6875rem/1.2 var(--codice); color: var(--tenue); }
@media (min-width: 900px) {
  .striscia { grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr) 84px minmax(0, 1fr); }
  .vignetta.contratto, .vignetta.relatore, .vignetta.epilogo { grid-column: 1 / -1; }
  .vignetta.contratto { margin-bottom: 18px; }
  .vignetta.esperto { grid-row: span 3; grid-template-rows: subgrid; }
  /* i fili passano all'altezza dei personaggi, da uno all'altro */
  .passaggio.orizzontale { grid-row: span 3; align-content: end; padding: 0 0 62px; }
  .passaggio.orizzontale .fili { flex-direction: column; height: auto; width: 62px; }
  .passaggio.orizzontale .fili i { width: 100%; height: 6px; }
  .passaggio.orizzontale .fili::after { left: auto; right: -9px; bottom: auto; top: 50%; transform: translateY(-50%); border: 7px solid transparent; border-left: 9px solid var(--tratto); border-right: 0; }
  .passaggio.giu { grid-column: 5; }
}

/* il relatore: riceve tutto e scrive il verdetto; gli esperti che non sono d'accordo intervengono */
.vignetta.relatore { gap: 14px; }
.verdetto-riga { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: end; }
@media (min-width: 700px) { .verdetto-riga { grid-template-columns: minmax(0, 1fr) auto; } }
.nuvola.grande { border-width: 3px; padding: 16px 18px; }
@media (min-width: 700px) {
  .nuvola.grande { margin: 0 18px 0 0; }
  .nuvola.grande::after { left: auto; right: -21px; bottom: 30px; width: 0; height: 0; background: none; transform: none; border: 0; border-radius: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-left: 20px solid var(--tratto); }
  .nuvola.grande::before { content: ""; position: absolute; right: -14px; bottom: 34px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 13px solid var(--foglio); z-index: 1; }
}
.racc { font-weight: 880; font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 0.95; letter-spacing: -0.03em; font-variation-settings: "wdth" 118; color: var(--colore, var(--inchiostro)); }
.racc.firmare { --colore: var(--firmare); } .racc.negoziare { --colore: var(--negoziare); } .racc.non-firmare { --colore: var(--rifiutare); }
.nuvola .motivo { font-weight: 500; font-variation-settings: "wdth" 96; }
.nuvola .conto { font-size: 0.9375rem; font-weight: 600; color: var(--tenue); }
.nuvola.ferma { border-color: var(--rifiutare); color: var(--rifiutare); }
.proteste { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 14px 18px; }
.protesta { display: flex; align-items: center; gap: 4px; max-width: 100%; }
.protesta svg { width: 50px; height: 50px; flex: none; }
.urlo { border: 2.5px solid var(--tratto); background: var(--foglio); border-radius: 14px; padding: 6px 11px; font-weight: 750; font-variation-settings: "wdth" 84; line-height: 1.25; position: relative; }
.protesta.grave .urlo { border-color: var(--grave); border-width: 3px; background: var(--grave-tenue); transform: rotate(-1.5deg); font-weight: 850; }
.protesta .chi { display: block; font-size: 0.75rem; font-weight: 700; color: var(--c); letter-spacing: 0.01em; }

.vignetta.epilogo { background: var(--didascalia); border-color: var(--didascalia-bordo); margin-top: 18px; display: grid; gap: 8px; }
.vignetta.epilogo p { max-width: 52rem; }
.vignetta.epilogo .conto { font-weight: 750; font-size: 1.05rem; }
.collegamenti { display: flex; flex-wrap: wrap; gap: 8px 20px; font-weight: 650; }

footer { font-size: 0.875rem; color: var(--tenue); border-top: 1px solid var(--linea); padding-top: 14px; display: grid; gap: 4px; }
.vuoto { background: var(--foglio); border: 2px dashed var(--linea); border-radius: 12px; padding: 24px; display: grid; gap: 10px; }

/* il racconto entra una volta, nell'ordine di lettura: ogni vignetta si disegna da sinistra, poi passano i fili */
@media (prefers-reduced-motion: no-preference) {
  .striscia.entra > * { animation: disegna 0.5s cubic-bezier(.3, .7, .3, 1) both; animation-delay: calc(var(--i, 0) * 380ms); }
  .striscia.entra .fili i, .striscia.entra .lettere svg { animation: scorre 0.45s ease-out both; animation-delay: calc(var(--i, 0) * 380ms + 120ms); }
}
@keyframes disegna { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes scorre { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main class="foglio" id="pagina"></main>

<script id="dati" type="application/json">null</script>
<script>
"use strict";

  },
  it: {

    indice: "← Tutti i verdetti", indiceDalVivo: "← Le prove dal vivo", lingue: "Lingua", modiGruppo: "Come si parlano gli esperti",

      const ruolo = RUOLI.includes(d.ruolo) ? d.ruolo : "relatore";
      return el("li", { class: `protesta ${d.tipo === "grave" ? "grave" : "lieve"}`, style: `--c: var(--${ruolo})` }, personaggio(ruolo, "protesta", { testa: true, titolo: t().nome[ruolo] }),
        el("span", { class: "urlo" }, el("span", { class: "chi" }, t().nome[ruolo]), d.tipo === "grave" ? t().grave(nomeDi(x)) : t().lieve(nomeDi(x))));
    }), dissensi.length > 4 ? el("li", { class: "tenue" }, t().altreProteste(dissensi.length - 4)) : null) : null));
  // epilogo: il controllo con le risposte degli esperti del dataset e il verdetto completo
  const c = v.confronto;
  const pagina = sicuro(v.verdetto);
  const fonte = c ? sicuro(c.link) : null;
  const chi = testoFonte(c?.chi);
  pezzi.push(el("section", { class: "vignetta epilogo", style: "--i: 8" },
    c && r ? el("p", { class: "conto" }, c.da_trovare ? t().confronto(chi, c.trovate, c.da_trovare) : t().nienteDaTrovare(chi)) : null,
    c && r && c.confrontate ? el("p", {}, t().accordo(c.d_accordo, c.confrontate)) : null,
    el("p", { class: "collegamenti" }, pagina ? el("a", { href: pagina }, t().apri) : null,
      fonte ? el("a", { href: fonte, target: "_blank", rel: "noopener" }, t().fonte) : null)));
  return el("div", { class: `striscia${entrato ? "" : " entra"}` }, pezzi);
}

function disegna() {
  document.documentElement.lang = lingua;
  const pagina = document.getElementById("pagina");
  const v = dati[modo] || dati.telepatia || dati.testo;
  modo = v.modalita;
  const indice = sicuro(dati.indice);
  const lingue = el("div", { class: "scelte", role: "group", "aria-label": t().lingue },
    ["en", "it"].map((l) => el("button", { type: "button", "aria-pressed": String(l === lingua), onclick: () => {
      if (l === lingua) return;
      lingua = l;
      try { localStorage.setItem("sportello-lingua", JSON.stringify(l)); } catch { /* vale per questa visita */ }
      disegna();
    } }, l === "en" ? "English" : "Italiano")));
  const modi = el("div", { class: "scelte modi", role: "group", "aria-label": t().modiGruppo },
    ["telepatia", "testo"].map((m) => el("button", { type: "button", "data-modo": m, "aria-pressed": String(m === modo), disabled: !dati[m],
      title: dati[m] ? null : t().manca, onclick: () => { if (m !== modo && dati[m]) { modo = m; entrato = false; disegna(); } } },
      m === "telepatia" ? t().memoria : t().testo)));
  const legenda = el("ul", { class: "legenda" },
    el("li", {}, simbolo("nuvola"), el("span", {}, t().legendaNuvola)),
    el("li", {}, modo === "testo" ? simbolo("busta") : simbolo("fili"), el("span", {}, modo === "testo" ? t().legendaLettere : t().legendaFili)));
  const quando = dati.dal_vivo ? t().dalVivo(dati.dal_vivo) : dati.registrato ? t().registrato(dati.registrato) : null;
  pagina.replaceChildren(
    el("div", { class: "barra" }, indice ? el("a", { href: indice }, dati.dal_vivo ? t().indiceDalVivo : t().indice) : el("span"), lingue),
    el("header", { class: "testa" },
      el("div", { class: "titoli" }, el("h1", {}, v.titolo), el("p", { class: "sotto" }, t().sotto), modi, legenda),
      cronometro()),
    striscia(v),
    el("footer", {}, quando ? el("span", {}, quando) : null, el("span", {}, t().modello(v.modello)),
      v.modalita === "telepatia" && Number.isInteger(v.passi_latenti) ? el("span", {}, t().passi(v.passi_latenti)) : null));
  document.title = t().titoloPagina(v.titolo);
  entrato = true;
}

function scegliLingua() {
  const chiesta = new URLSearchParams(location.search).get("lang");
  let salvata = null;
  try { salvata = JSON.parse(localStorage.getItem("sportello-lingua")); } catch { /* niente */ }
  for (const l of [chiesta, salvata, dati?.lingua, "en"]) if (l === "it" || l === "en") return l;
  return "en";
}

// Una prova dal vivo: la sua vista e, se il giudice ha fatto lo stesso contratto anche nell'altro modo, quella più recente.
function dalVivo(id) {
  let fatte = [];
  try { fatte = JSON.parse(localStorage.getItem("consiglio-dal-vivo")) || []; } catch { /* niente */ }
  if (!Array.isArray(fatte)) return null;
  const voce = fatte.find((f) => f && f.id_caso === id && f.vista);
  if (!voce) return null;
  const v = voce.vista;
  const altra = fatte.find((f) => f && f.vista && f.id_caso !== id && f.vista.benchmark === v.benchmark && f.vista.contratto === v.contratto && f.vista.modalita !== v.modalita);
  const conPagina = (f) => ({ ...f.vista, verdetto: `verdetto.html?dal-vivo=${encodeURIComponent(f.id_caso)}` });
  return { [v.modalita]: conPagina(voce), ...(altra ? { [altra.vista.modalita]: conPagina(altra) } : {}),
    modo: v.modalita, dal_vivo: v.dal_vivo || voce.quando, lingua: v.lingua, indice: "prova.html" };
}

function avvia() {
  const parametri = new URLSearchParams(location.search);
  dati = JSON.parse(document.getElementById("dati").textContent);
  const id = parametri.get("dal-vivo");
  if (!dati && id) dati = dalVivo(id);
  lingua = scegliLingua();
  if (!dati || !(dati.telepatia || dati.testo)) {
    document.documentElement.lang = lingua;
    document.getElementById("pagina").replaceChildren(el("section", { class: "vuoto" },
      el("h1", {}, lingua === "en" ? "Comic strip" : "Fumetto"), el("p", { class: "tenue" }, id ? t().nonQui : t().vuoto),
      el("p", {}, el("a", { href: id ? "prova.html" : "index.html" }, id ? t().indiceDalVivo : t().indice))));
    return;
  }
  // la modalità del verdetto da cui si arriva (?modo=), oppure quella della prova dal vivo aperta
  const chiesto = parametri.get("modo") || dati.modo;
  modo = (chiesto === "telepatia" || chiesto === "testo") && dati[chiesto] ? chiesto : dati.telepatia ? "telepatia" : "testo";
  disegna();
}
avvia();
</script>
