<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdetto del Consiglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Pagina del verdetto (regole di «Verdetto e dissenso»): un documento da leggere dall'alto, la raccomandazione prima di tutto.
   Stessi caratteri e colori della casa per i giudici: Archivo per la pagina, Source Serif per le parole del
   contratto, un colore per esperto. In italiano per la PMI cliente, in inglese per i giudici. */
:root {
  --carta: #f6f7f9; --foglio: #ffffff; --inchiostro: #151a30; --tenue: #565d70; --linea: #dcdfe6;
  --accento: #087a6d; --accento-tenue: #ddf3ef;
  --legale: #2f62c8; --finanza: #12a594; --rischio: #7458d6;
  --firmare: #1f7a4d; --firmare-tenue: #e3f3ea; --negoziare: #8a5208; --negoziare-tenue: #fbf0dc;
  --rifiutare: #b42318; --rifiutare-tenue: #fde7e4; --grave: #b42318; --lieve: #8a5208;
  --pagina: "Archivo", "Segoe UI", system-ui, sans-serif;
  --contratto: "Source Serif 4", Georgia, serif;
  --codice: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #0e1324; --foglio: #161c31; --inchiostro: #e8ebf4; --tenue: #a4aabb; --linea: #2b3350;
    --accento: #4fd1bf; --accento-tenue: #123833; --legale: #7aa2f2; --finanza: #35c2ae; --rischio: #a893f2;
    --firmare: #5bc48e; --firmare-tenue: #16301f; --negoziare: #e6b35e; --negoziare-tenue: #362a14;
    --rifiutare: #f08a7f; --rifiutare-tenue: #3a1a17; --grave: #f08a7f; --lieve: #e6b35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #0e1324; --foglio: #161c31; --inchiostro: #e8ebf4; --tenue: #a4aabb; --linea: #2b3350;
  --accento: #4fd1bf; --accento-tenue: #123833; --legale: #7aa2f2; --finanza: #35c2ae; --rischio: #a893f2;
  --firmare: #5bc48e; --firmare-tenue: #16301f; --negoziare: #e6b35e; --negoziare-tenue: #362a14;
  --rifiutare: #f08a7f; --rifiutare-tenue: #3a1a17; --grave: #f08a7f; --lieve: #e6b35e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 400 1rem/1.6 var(--pagina); font-variation-settings: "wdth" 100; padding-inline: 16px; padding-block: 20px 72px; }
.foglio { max-width: 920px; margin-inline: auto; display: grid; gap: 32px; }
h1, h2, h3 { line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4.2vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; font-variation-settings: "wdth" 108; overflow-wrap: anywhere; }
h2 { font-size: 1.2rem; font-weight: 740; letter-spacing: -0.01em; font-variation-settings: "wdth" 106; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 0.18em; }
button { font: inherit; color: inherit; cursor: pointer; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accento); outline-offset: 3px; border-radius: 4px; }
.tenue { color: var(--tenue); }
.etichetta { font-size: 0.875rem; font-weight: 600; color: var(--tenue); }

/* barra */
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.barra a { font-weight: 600; font-size: 0.9375rem; text-decoration: none; }
.lingue { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; padding: 2px; background: var(--foglio); margin-left: auto; }
.lingue button { border: 0; background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 0.875rem; }
.lingue button[aria-pressed="true"] { background: var(--inchiostro); color: var(--foglio); }

/* intestazione */
.testa { display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; align-items: flex-start; }
.testa .titoli { display: grid; gap: 10px; min-width: 0; flex: 1 1 420px; }
.sigillo { border: 1px solid var(--linea); background: var(--foglio); border-radius: 12px; padding: 10px 14px; display: grid; gap: 4px; min-width: 230px; color: inherit; }
.sigillo summary { cursor: pointer; display: grid; gap: 2px; }
.sigillo strong { font-size: 0.95rem; }
.sigillo.integro strong { color: var(--firmare); }
.sigillo.rotto { border-color: var(--rifiutare); background: var(--rifiutare-tenue); }
.sigillo.rotto strong { color: var(--rifiutare); }
.impronte { font: 0.75rem/1.5 var(--codice); color: var(--tenue); overflow-wrap: anywhere; }
.lingua-modello { font-size: 0.9375rem; color: var(--tenue); border-left: 3px solid var(--linea); padding-left: 12px; }

/* raccomandazione */
.raccomandazione { background: var(--foglio); border: 1px solid var(--linea); border-top: 6px solid var(--colore); border-radius: 14px; padding: 22px 24px 24px; display: grid; gap: 12px; }
.raccomandazione .valore { font-weight: 850; font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1; letter-spacing: -0.03em; font-variation-settings: "wdth" 116; color: var(--colore); }
.raccomandazione.firmare { --colore: var(--firmare); }
.raccomandazione.negoziare { --colore: var(--negoziare); }
.raccomandazione.non-firmare { --colore: var(--rifiutare); }
.raccomandazione .motivo { max-width: 46rem; }
.avviso-rosso { background: var(--rifiutare-tenue); border: 2px solid var(--rifiutare); border-radius: 14px; padding: 20px 22px; display: grid; gap: 8px; }
.avviso-rosso h2 { color: var(--rifiutare); }
.numeri { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 0.9375rem; color: var(--tenue); }
.numeri b { color: var(--inchiostro); font-variant-numeric: tabular-nums; }

/* confronto con le risposte giuste del dataset: solo nel sito dei giudici */
.confronto { border-left: 3px solid var(--accento); padding: 4px 0 4px 16px; display: grid; gap: 6px; }
.confronto .conto { font-weight: 700; font-size: 1.1rem; }
.confronto a { color: var(--inchiostro); }

/* obiezioni */
.obiezioni { display: grid; gap: 10px; }
.obiezioni ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* righe */
.gruppo { display: grid; gap: 10px; }
.gruppo > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; border-bottom: 2px solid var(--c); padding-bottom: 6px; }
.gruppo > header h2 { display: flex; align-items: center; gap: 10px; }
.gruppo > header h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.righe { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.riga { background: var(--foglio); border: 1px solid var(--linea); border-radius: 10px; padding: 12px 16px; display: grid; gap: 10px; min-width: 0; }
.riga.segnalata { border-left: 4px solid var(--c); }
.riga .capo { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.riga .nome { font-weight: 650; }
.riga .chiave { font-size: 0.8125rem; color: var(--tenue); margin-left: 6px; }
.pillole { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pillola { font-size: 0.8125rem; font-weight: 600; line-height: 1; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--linea); color: var(--tenue); white-space: nowrap; }
.pillola.si { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--inchiostro); border-color: transparent; }
.pillola.ok { color: var(--firmare); }
.pillola.no-trovata { color: var(--rifiutare); border-color: var(--rifiutare); }
.citazione { margin: 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--linea); font: 400 1.0625rem/1.55 var(--contratto); color: var(--inchiostro); overflow-wrap: anywhere; }
.motivazione { color: var(--tenue); }
.esperti { border-radius: 8px; padding: 8px 12px; display: grid; gap: 6px; background: var(--carta); font-size: 0.9375rem; }
.esperti.diverso { background: var(--rifiutare-tenue); }
.esperti .esito { font-weight: 600; }
.esperti.uguale .esito { color: var(--firmare); }
.esperti.diverso .esito { color: var(--rifiutare); }
.esperti details > summary { cursor: pointer; color: var(--tenue); }
.esperti .citazione { margin-top: 6px; }
.dissenso { border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: var(--negoziare-tenue); }
.dissenso.grave { background: var(--rifiutare-tenue); }
.dissenso .chi { font-weight: 600; }
.dissenso.grave .chi { color: var(--grave); }
details.dissenso > summary { cursor: pointer; font-weight: 600; color: var(--lieve); }
details.dissenso.grave > summary { color: var(--grave); }
.scelta { display: flex; flex-wrap: wrap; gap: 8px; }
.scelta button { border: 1px solid var(--linea); background: var(--foglio); border-radius: 8px; padding: 6px 12px; }
.scelta button[aria-pressed="true"] { background: var(--inchiostro); color: var(--foglio); border-color: var(--inchiostro); }

/* azioni e note degli esperti */
.azioni { display: flex; flex-wrap: wrap; gap: 10px; }
.azioni button { border: 1.5px solid var(--inchiostro); background: var(--inchiostro); color: var(--foglio); border-radius: 10px; padding: 9px 16px; font-weight: 650; }
.azioni button.secondario { background: transparent; color: var(--inchiostro); }
.note { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.nota { background: var(--foglio); border: 1px solid var(--linea); border-top: 3px solid var(--c, var(--linea)); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.nota ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 0.9375rem; }
footer { font-size: 0.875rem; color: var(--tenue); border-top: 1px solid var(--linea); padding-top: 16px; display: grid; gap: 6px; }
footer code { font: 0.8125rem var(--codice); }
.carica { background: var(--foglio); border: 2px dashed var(--linea); border-radius: 14px; padding: 28px; text-align: center; display: grid; gap: 10px; }

/* riepilogo da stampare in PDF: raccomandazione, clausole segnalate, dissensi e scelte della persona */
.solo-stampa { display: none; }
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 11pt; }
  .non-stampare { display: none !important; }
  .solo-stampa { display: block; }
  .riga:not(.segnalata):not(.con-dissenso) { display: none; }
  .riga, .raccomandazione, .sigillo { border-color: #999; break-inside: avoid; }
  details.dissenso > *:not(summary) { display: block; }
}
</style>
</head>

  for (const l of [chiesta, salvata, vista.lingua, "it"]) if (l === "it" || l === "en") return l;
  return "it";
}

async function avvia() {
  const vedi = (vista) => { lingua = scegliLingua(vista); mostra(vista); };
  const incorporati = JSON.parse(document.getElementById("dati").textContent);
  if (incorporati) return vedi(incorporati);
  const percorso = new URLSearchParams(location.search).get("vista");
  if (percorso) {
    try { return vedi(await (await fetch(percorso)).json()); } catch (e) { console.error(e); }
  }
  document.getElementById("file").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (file) vedi(JSON.parse(await file.text()));
  });
}
avvia();
</script>
