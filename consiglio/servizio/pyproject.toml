[project]
name = "revisore"
version = "0.1.0"
description = "Consiglio silenzioso: il server per Evolus, i due tool via MCP e HTTP"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "pypdf==6.19.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["revisore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Il Consiglio sta in consiglio/revisione, che non si installa.
pythonpath = [".", "../revisione"]
