# The MI300X in windows: every half hour the time is compared with site/windows.json. Inside a window, 45
# minutes ahead, the MI300X must be running; outside it is destroyed, because even powered off it is billed ($2.59 an hour).
# It only touches the machines with the tag council-window (and the legacy sportello-finestra of the old code): those
# started by hand to work on stay.
# GitHub can delay or skip a schedule: running often and off the round hour, the next run puts things right.
# Schedules only run from the main branch.
#
# Secrets: DIGITALOCEAN_ACCESS_TOKEN (token of the AMD Developer Cloud team), MI300X_SSH (fingerprint of the SSH key).
# Optional variables: DO_API (https://api.devcloud.amd.com if the default one does not accept the AMD token),
# MI300X_DNS_DOMAIN and MI300X_DNS_NAME (the A record to point at the new IP, if the domain is in DigitalOcean's DNS).
name: MI300X in windows

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "windows: as in windows.json; destroy-all: also the machines started by hand"
        type: choice
        default: status
        options: [status, windows, create, destroy, destroy-all]

concurrency:
  group: mi300x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mi300x:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The MI300X
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          MI300X_SSH: ${{ secrets.MI300X_SSH }}
          DO_API: ${{ vars.DO_API || 'https://api.digitalocean.com' }}
          MI300X_DNS_DOMAIN: ${{ vars.MI300X_DNS_DOMAIN }}
          MI300X_DNS_NAME: ${{ vars.MI300X_DNS_NAME }}
          COMMAND: ${{ inputs.command || 'windows' }}
        run: |
          if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ]; then
            echo "The secret DIGITALOCEAN_ACCESS_TOKEN is missing: nothing to do."
            exit 0
          fi
          s=site/mi300x/mi300x.sh
          case "$COMMAND" in
            windows) $s windows site/windows.json ;;
            create) MI300X_TAG=council-window $s create ;;
            destroy) MI300X_TAG=council-window $s destroy ;;
            destroy-all) MI300X_TAG=council-window $s destroy && MI300X_TAG=council-mi300x $s destroy ;;
            *) MI300X_TAG=council-window $s status && MI300X_TAG=council-mi300x $s status ;;
          esac
