[project]
name = "controllore"
version = "0.1.0"
description = "Sportello telepatico: livello 2 della macchina della verità, coerenza e tre testimoni"
requires-python = ">=3.12"
dependencies = ["fatture"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["controllore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
