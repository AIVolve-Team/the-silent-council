[project]
name = "fatture"
version = "0.1.0"
description = "Sportello telepatico: fatture di prova, archivi e regole del catalogo"
requires-python = ">=3.12"
dependencies = ["faker==40.41.0", "reportlab==5.0.1", "pypdf==6.19.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fatture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
