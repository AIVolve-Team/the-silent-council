[project]
name = "pipeline"
version = "0.1.0"
description = "Sportello telepatico: estrattore, verificatore e decisore sul motore, in telepatia e a testo"
requires-python = ">=3.12"
dependencies = ["fatture", "controllore", "pypdf"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["modello: carica un Qwen3 piccolo (lento, scarica il modello la prima volta)"]
