[project]
name = "traduttore"
version = "0.1.0"
description = "Sportello telepatico: il traduttore, la trascrizione della memoria e G3"
requires-python = ">=3.12"
dependencies = ["motore"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["traduttore"]

[tool.setuptools.package-data]
traduttore = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["modello: carica un modello vero (lento)"]
