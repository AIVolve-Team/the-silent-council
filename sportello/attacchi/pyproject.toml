[project]
name = "attacchi"
version = "0.1.0"
description = "Sportello telepatico: i 50 attacchi di «Catalogo degli attacchi», costruiti sulle fatture pulite e misurati per famiglia"
requires-python = ">=3.12"
dependencies = ["fatture", "controllore", "pipeline"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["attacchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["modello: carica un Qwen3 piccolo (lento, scarica il modello la prima volta)"]
