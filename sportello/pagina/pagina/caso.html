<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sportello case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Pagina del caso dello Sportello (decisa in «Caso passato a una persona»): dall'alto, esito e motivo, poi cosa non torna, poi la fattura
   accanto all'ordine. Stessi caratteri e colori della pagina del verdetto del Consiglio. */
:root {
  --carta: #f4f6f9; --foglio: #ffffff; --inchiostro: #121826; --tenue: #5b6474; --linea: #dde2ea;
  --accento: #2b4acb; --accento-tenue: #e6ebfb;
  --pagare: #1f7a4d; --pagare-tenue: #e3f3ea; --persona: #9a5b0b; --persona-tenue: #fbf0dc;
  --bloccare: #b42318; --bloccare-tenue: #fde7e4;
  --display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --testo: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --dati: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #0f131a; --foglio: #171c25; --inchiostro: #e8ecf2; --tenue: #9aa4b4; --linea: #2a3140;
    --accento: #8ea3f2; --accento-tenue: #222b44; --pagare: #5bc48e; --pagare-tenue: #16301f;
    --persona: #e6b35e; --persona-tenue: #362a14; --bloccare: #f08a7f; --bloccare-tenue: #3a1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #0f131a; --foglio: #171c25; --inchiostro: #e8ecf2; --tenue: #9aa4b4; --linea: #2a3140;
  --accento: #8ea3f2; --accento-tenue: #222b44; --pagare: #5bc48e; --pagare-tenue: #16301f;
  --persona: #e6b35e; --persona-tenue: #362a14; --bloccare: #f08a7f; --bloccare-tenue: #3a1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 16px/1.55 var(--testo); padding-inline: 16px; padding-block: 24px 64px; }
.foglio { max-width: 1040px; margin-inline: auto; display: grid; gap: 26px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; }
.eyebrow { font: 500 0.72rem/1 var(--dati); letter-spacing: 0.08em; text-transform: uppercase; color: var(--tenue); }
.tenue { color: var(--tenue); }
.dato { font-family: var(--dati); font-size: 0.92em; overflow-wrap: anywhere; }
.barra { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.lingue button { border: 1px solid var(--linea); background: var(--foglio); color: var(--inchiostro); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
.lingue button[aria-pressed="true"] { background: var(--inchiostro); color: var(--foglio); border-color: var(--inchiostro); }
.registrato { font-size: 0.85rem; background: var(--accento-tenue); color: var(--accento); border-radius: 999px; padding: 4px 12px; }

.testa { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-start; }
.testa .titoli { display: grid; gap: 8px; min-width: 0; flex: 1 1 420px; }
.numeri { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 0.92rem; color: var(--tenue); }
.numeri b { color: var(--inchiostro); font-variant-numeric: tabular-nums; }
.sigillo { border: 1px solid var(--linea); background: var(--foglio); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; min-width: 220px; }
.sigillo strong { font-family: var(--display); font-size: 0.95rem; color: var(--pagare); }
.sigillo.rotto { border-color: var(--bloccare); background: var(--bloccare-tenue); }
.sigillo.rotto strong { color: var(--bloccare); }

.esito { background: var(--foglio); border: 1px solid var(--linea); border-left: 8px solid var(--colore); border-radius: 12px; padding: 22px 24px; display: grid; gap: 10px; }
.esito .valore { font: 800 clamp(1.9rem, 6vw, 2.8rem)/1 var(--display); color: var(--colore); text-transform: uppercase; letter-spacing: 0.01em; }
.esito .motivo { font-size: 1.12rem; }
.esito.pagare { --colore: var(--pagare); }
.esito.persona { --colore: var(--persona); }
.esito.bloccare { --colore: var(--bloccare); }
.frode { background: var(--bloccare-tenue); border: 2px solid var(--bloccare); border-radius: 12px; padding: 18px 20px; display: grid; gap: 10px; }
.frode h2 { color: var(--bloccare); }
.contatti { display: flex; flex-wrap: wrap; gap: 6px 22px; }

section.parte { display: grid; gap: 12px; }
section.parte > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--linea); padding-bottom: 6px; }
.scheda { background: var(--foglio); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
th { font: 600 0.78rem/1.3 var(--dati); color: var(--tenue); text-transform: uppercase; letter-spacing: 0.04em; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.diverso td { background: var(--bloccare-tenue); }
tr.diverso td:first-child { box-shadow: inset 4px 0 0 var(--bloccare); }
.segno { font-weight: 700; }
tr.diverso .segno { color: var(--bloccare); }
.motivi { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.motivi li { background: var(--foglio); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; }
.motivi .codice { font: 500 0.78rem var(--dati); color: var(--tenue); }
.motivi li.bloccare { border-left: 4px solid var(--bloccare); }
.motivi li.persona { border-left: 4px solid var(--persona); }
.affiancati { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.pdf { width: 100%; height: 520px; border: 1px solid var(--linea); border-radius: 10px; background: #fff; }
.nascosto { background: var(--bloccare-tenue); border: 1px dashed var(--bloccare); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.nascosto mark { background: transparent; color: var(--bloccare); font-weight: 600; }

.azioni { display: flex; flex-wrap: wrap; gap: 10px; }
.azioni button { border: 1px solid var(--inchiostro); background: var(--inchiostro); color: var(--foglio); border-radius: 8px; padding: 9px 16px; font-weight: 600; }
.azioni button.secondario { background: transparent; color: var(--inchiostro); }
.azioni button.pericolo { background: var(--bloccare); border-color: var(--bloccare); color: #fff; }
.azioni button:disabled { opacity: 0.45; cursor: not-allowed; }
.decisione { display: grid; gap: 12px; background: var(--foglio); border: 1px solid var(--linea); border-radius: 12px; padding: 16px 18px; }
.decisione label { display: grid; gap: 4px; font-size: 0.92rem; }
.decisione textarea { min-height: 64px; border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; background: var(--carta); color: var(--inchiostro); }
.stato-scelta { font-weight: 600; }
footer { font-size: 0.85rem; color: var(--tenue); border-top: 1px solid var(--linea); padding-top: 14px; display: grid; gap: 6px; }
code { font-family: var(--dati); font-size: 0.85em; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .non-stampare { display: none !important; }
}
</style>
</head>

    bottoneNascosto.textContent = nascosto.hidden ? t.mostraNascosto : t.nascondiNascosto;
  });
  const bottonePensieri = el("button", { type: "button", class: "secondario", title: t.pensieriNota, text: t.pensieri });
  bottonePensieri.addEventListener("click", () => { testimoni.scrollIntoView({ behavior: "smooth", block: "center" }); testimoni.animate([{ outline: "3px solid var(--accento)" }, { outline: "3px solid transparent" }], 1600); });
  pagina.append(el("section", { class: "parte" }, el("header", {}, el("h2", { text: t.fatturaOrdine })),
    el("div", { class: "azioni non-stampare" }, bottoneNascosto, bottonePensieri), nascosto,
    el("div", { class: "affiancati" }, el("div", { class: "scheda" }, el("h3", { text: t.fattura }), righeFattura),
      el("div", { class: "scheda" }, el("h3", { text: V.ordine ? `${t.ordine} ${V.ordine.numero}` : t.ordine }), righeOrdine)),
    el("div", { class: "scheda non-stampare" }, el("h3", { text: t.pdf }),
      el("object", { class: "pdf", type: "application/pdf", data: pdfUrl, "aria-label": t.pdf },
        el("a", { href: pdfUrl, target: "_blank", rel: "noopener", text: t.pdf })))));

  pagina.append(decisione(t));

  const comando = `python -m motore.verifica registro-${V.id} --pubbliche registro-${V.id}/chiavi-pubbliche`;
  pagina.append(el("footer", {}, el("strong", { text: t.registro }), el("span", { text: t.registroTesto }),
    V.registro ? el("a", { href: V.registro, download: "", text: t.scarica }) : null, el("span", {}, `${t.verifica} `, el("code", { text: comando }))));
}

function decisione(t) {
  const salvata = memoria.leggi(chiave);
  const nota = el("textarea", { id: "nota", "aria-label": t.notaTesto, placeholder: V.nota_obbligatoria ? t.notaObbl : "" });
  const stato = el("p", { class: "stato-scelta", role: "status" });
  const mostra = (s) => { if (s) stato.textContent = `${t.scelta}: ${t[s.scelta]} · ${s.inviata ? t.inviata : t.salvata}`; };
  mostra(salvata);
  const scegli = async (scelta) => {
    const testo = nota.value.trim();
    if (scelta === "approvato" && V.nota_obbligatoria && !testo) { nota.focus(); nota.placeholder = t.notaObbl; return; }
    if (scelta === "rifiutato" && !testo) { nota.focus(); nota.placeholder = t.motivoRifiuto; return; }
    const s = { scelta, nota: testo, quando: new Date().toISOString(), inviata: false };
    if (scelta === "segnalato") {
      const lista = memoria.leggi("sportello-iban-da-sorvegliare") || [];
      const sospetto = (V.testimoni.find((r) => r.campo === "pagamento.iban") || {}).lettura;
      if (sospetto && !lista.includes(sospetto)) memoria.scrivi("sportello-iban-da-sorvegliare", [...lista, sospetto]);
    }
    const api = document.body.dataset.api;
    if (api) {
      try {
        const r = await fetch(api, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_caso: V.id, decisione: scelta, nota: testo }) });
        s.inviata = r.ok;
      } catch { s.inviata = false; }
    }
    memoria.scrivi(chiave, s);
    mostra(s);
  };
  const bottoni = el("div", { class: "azioni" },
    el("button", { type: "button", "data-scelta": "approvato", text: t.approva }),
    el("button", { type: "button", class: "secondario", "data-scelta": "rifiutato", text: t.rifiuta }),
    el("button", { type: "button", class: "pericolo", "data-scelta": "segnalato", text: t.segnala }));
  bottoni.addEventListener("click", (e) => { const s = e.target.dataset.scelta; if (s) scegli(s); });
  const iban = V.contatti ? V.contatti.iban_registrato : null;
  return el("section", { class: "decisione non-stampare" }, el("h2", { text: t.decidi }),
    el("p", { class: "tenue" }, `${t.approvaNota}${iban ? ": " : ""}`, iban ? el("b", { class: "dato", text: iban }) : null),
    el("label", { for: "nota" }, el("span", { text: V.nota_obbligatoria ? t.notaTesto : t.motivoRifiuto }), nota), bottoni, stato);
}

if (V) disegna();
else {
  const t = T[lingua] || T.en;
  document.getElementById("pagina").append(el("p", { text: t.nonTrovato }), el("a", { href: "index.html", text: t.indietro }));
}
</script>
</body>
</html>
