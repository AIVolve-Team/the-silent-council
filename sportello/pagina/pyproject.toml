[project]
name = "pagina"
version = "0.1.0"
description = "Sportello telepatico: la pagina del caso e l'elenco delle proposte di pagamento"
requires-python = ">=3.12"
dependencies = ["fatture", "controllore", "pipeline", "traduttore"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pagina"]

[tool.setuptools.package-data]
pagina = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
