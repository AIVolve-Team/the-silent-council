[project]
name = "harness"
version = "0.1.0"
description = "Sportello telepatico: misure pre-registrate di «Eval pre-registrato G1-G4», G2, esame del 16/10 e lista di G4"
requires-python = ">=3.12"
dependencies = ["fatture", "controllore", "pipeline"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["modello: carica un Qwen3 piccolo (lento, scarica il modello la prima volta)"]
