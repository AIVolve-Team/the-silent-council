<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consiglio silenzioso · AIVolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* L'indice del Consiglio nel sito per i giudici: una riga per contratto, con telepatia e testo affiancati.
   Stessi caratteri e colori della home (casa/sorgenti/index.html): il verde acqua è solo della memoria. */
:root {
  --carta: #f6f7f9; --foglio: #ffffff; --inchiostro: #151a30; --grafite: #565d70; --linea: #dcdfe6;
  --memoria: #087a6d; --memoria-pieno: #12a594;
  --firmare: #1f7a4d; --negoziare: #8a5208; --rifiutare: #b42318;
  --titoli: "Archivo", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #0e1324; --foglio: #161c31; --inchiostro: #e8ebf4; --grafite: #a4aabb; --linea: #2b3350;
    --memoria: #4fd1bf; --memoria-pieno: #35c2ae; --firmare: #5bc48e; --negoziare: #e6b35e; --rifiutare: #f08a7f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #0e1324; --foglio: #161c31; --inchiostro: #e8ebf4; --grafite: #a4aabb; --linea: #2b3350;
  --memoria: #4fd1bf; --memoria-pieno: #35c2ae; --firmare: #5bc48e; --negoziare: #e6b35e; --rifiutare: #f08a7f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 400 1rem/1.6 var(--titoli); font-variation-settings: "wdth" 100; padding: 20px 16px 72px; }
.foglio { max-width: 1120px; margin-inline: auto; display: grid; gap: 36px; }
p, h1, h2 { margin: 0; }
a { color: inherit; text-underline-offset: 0.18em; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--memoria); outline-offset: 3px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.tenue { color: var(--grafite); }
.barra { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.barra a { font-weight: 600; font-size: 0.9375rem; text-decoration: none; }
.lingue { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; padding: 2px; background: var(--foglio); }
.lingue button { border: 0; background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 0.875rem; }
.lingue button[aria-pressed="true"] { background: var(--inchiostro); color: var(--foglio); }
.testa { display: grid; gap: 14px; }
.testa h1 { font-weight: 820; font-size: clamp(2.1rem, 5.4vw, 3.6rem); line-height: 1.04; letter-spacing: -0.025em; font-variation-settings: "wdth" 112; }
.testa .sotto { font-size: clamp(1.05rem, 1.8vw, 1.2rem); line-height: 1.5; color: var(--grafite); max-width: 44rem; }
.testa .piccolo { font-size: 0.9375rem; color: var(--grafite); max-width: 52rem; }
.testa .piccolo a { color: var(--inchiostro); }

.elenco { display: grid; }
.intestazione, .contratto { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
.intestazione { font-weight: 700; font-size: 0.9375rem; padding-bottom: 10px; border-bottom: 2px solid var(--inchiostro); }
.intestazione .memoria { color: var(--memoria); }
.contratto { padding: 22px 0; border-bottom: 1px solid var(--linea); align-items: start; }
.contratto h2 { font-size: 1.15rem; font-weight: 720; line-height: 1.25; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.contratto .id { font-size: 0.8125rem; color: var(--grafite); overflow-wrap: anywhere; margin-top: 4px; }
.cella { display: grid; gap: 6px; align-content: start; min-width: 0; }
.cella .modo { display: none; font-weight: 700; font-size: 0.875rem; }
.cella.memoria .modo { color: var(--memoria); }
.racc { font-weight: 800; font-size: 1.35rem; line-height: 1.1; letter-spacing: -0.015em; font-variation-settings: "wdth" 110; }
.racc.firmare { color: var(--firmare); } .racc.negoziare { color: var(--negoziare); } .racc.non-firmare { color: var(--rifiutare); }
.racc.nessuna { color: var(--grafite); font-size: 1.05rem; }
.cella .riga { font-size: 0.9375rem; }
.cella .riga b { font-variant-numeric: tabular-nums; }
.cella .costo { font-size: 0.875rem; color: var(--grafite); }
.cella .rotto { font-size: 0.875rem; font-weight: 600; color: var(--rifiutare); }
.apri { justify-self: start; margin-top: 4px; display: inline-block; text-decoration: none; font-weight: 650; font-size: 0.9375rem; border-radius: 10px; padding: 7px 14px; border: 1.5px solid var(--inchiostro); }
.cella.memoria .apri { background: var(--inchiostro); color: var(--foglio); }
.vuoto { padding: 22px 0; color: var(--grafite); border-bottom: 1px solid var(--linea); }
footer { font-size: 0.875rem; color: var(--grafite); }

@media (max-width: 760px) {
  .intestazione { display: none; }
  .contratto { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 20px; }
  .contratto > div:first-child { grid-column: 1 / -1; }
  .cella .modo { display: block; }
}
@media (max-width: 460px) {
  .contratto { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<main class="foglio" id="pagina"></main>
<script id="dati" type="application/json">null</script>
<script>
"use strict";
// I verdetti arrivano dal blocco "dati", scritto da revisione/vetrina.py. Tutto il testo entra con textContent.
const T = {
  en: {
    casa: "← Home", titolo: "Consiglio silenzioso",
    sotto: "A legal, a finance and a risk expert review a contract for an Italian small business by handing over their memory instead of writing to each other. A devil's advocate writes the verdict, dissent included.",
    registrato: (q) => `Recorded ${q}.`,
    fonti: "We did not write these contracts, nor their right answers. They come from public datasets annotated by legal experts:", fontiDopo: "Every verdict shows the experts' answers next to the council's, mistakes included.",
    nota: "Verdict pages open in English. The council writes its reasoning in Italian, for the Italian business it works for.",
    contratto: "Contract", memoria: "Handing over memory", testo: "Writing to each other",
    racc: { "firmare": "Sign", "negoziare": "Negotiate", "non firmare": "Do not sign" }, nessuna: "No valid verdict",
    trovate: (a, b) => [`Found `, el("b", { text: String(a) }), ` of the `, el("b", { text: String(b) }), ` clauses the experts flagged`],
    nienteDaTrovare: "The experts flagged nothing in this contract",
    accordo: (a, b) => [`Agrees with them on `, el("b", { text: String(a) }), ` of `, el("b", { text: String(b) }), ` clauses`],
    costo: (t, s) => `${t.toLocaleString("en-GB")} tokens written in ${s} s`,
    rotto: "⚠ Seal broken: the council stopped",
    apri: "Open the verdict", manca: "Not recorded in this mode", da: (f) => `From ${f}`,
    vuoto: "No verdicts recorded yet.", lingue: "Language",
    piede: "Contracts from public datasets under CC BY 4.0. Your choices on the dissents stay in your browser.",
  },
  it: {
    casa: "← Home", titolo: "Consiglio silenzioso",
    sotto: "Un esperto legale, uno di finanza e uno di rischio rivedono un contratto per una piccola impresa italiana passandosi la memoria invece di scriversi. Un avvocato del diavolo scrive il verdetto, dissenso compreso.",
    registrato: (q) => `Registrati: ${q}.`,
    fonti: "Questi contratti non li abbiamo scritti noi, e nemmeno le risposte giuste. Vengono da dataset pubblici annotati da esperti di diritto:", fontiDopo: "Ogni verdetto mostra le risposte degli esperti accanto a quelle del Consiglio, errori compresi.",
    nota: "Le pagine del verdetto si aprono in inglese. Il Consiglio scrive i suoi ragionamenti in italiano, per l'impresa italiana per cui lavora.",
    contratto: "Contratto", memoria: "Si passano la memoria", testo: "Si scrivono",
    racc: { "firmare": "Firmare", "negoziare": "Negoziare", "non firmare": "Non firmare" }, nessuna: "Nessun verdetto valido",
    trovate: (a, b) => [`Trovate `, el("b", { text: String(a) }), ` delle `, el("b", { text: String(b) }), ` clausole segnate dagli esperti`],
    nienteDaTrovare: "Gli esperti non hanno segnato niente in questo contratto",
    accordo: (a, b) => [`D'accordo con loro su `, el("b", { text: String(a) }), ` clausole su `, el("b", { text: String(b) })],
    costo: (t, s) => `${t.toLocaleString("it-IT")} token scritti in ${s} s`,
    rotto: "⚠ Sigillo rotto: il Consiglio si è fermato",
    apri: "Apri il verdetto", manca: "Non registrato in questa modalità", da: (f) => `Da ${f}`,
    vuoto: "Non ci sono ancora verdetti registrati.", lingue: "Lingua",
    piede: "Contratti da dataset pubblici con licenza CC BY 4.0. Le tue scelte sui dissensi restano nel tuo browser.",
  },
};
const FONTI = { CUAD: "https://github.com/TheAtticusProject/cuad", ContractNLI: "https://stanfordnlp.github.io/contract-nli/",
  CLAUDETTE: "https://github.com/lt-nlp-lab-unibo/Multilingual-Unfair-Clause-Detection" };
const NOMI_BENCHMARK = { cuad: "CUAD", contractnli: "ContractNLI", claudette: "CLAUDETTE", dimostrativo: { en: "the demo set", it: "il set dimostrativo" } };
const memoria = {
  leggi(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* vale per questa visita */ } },
};
// La stessa chiave della home: la lingua scelta lì vale anche qui.
const chiesta = new URLSearchParams(location.search).get("lang");
let lingua = chiesta === "it" || chiesta === "en" ? chiesta : memoria.leggi("sportello-lingua") === "it" ? "it" : "en";
const dati = JSON.parse(document.getElementById("dati").textContent || "null") || { verdetti: [] };
const el = (tag, attr = {}, ...figli) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attr)) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (v !== null && v !== undefined) n.setAttribute(k, v); }
  for (const f of figli.flat()) if (f !== null && f !== undefined && f !== false) n.append(f instanceof Node ? f : document.createTextNode(String(f)));
  return n;
};

function cella(t, v, modo) {
  const etichetta = el("span", { class: "modo", text: modo === "telepatia" ? t.memoria : t.testo });
  if (!v) return el("div", { class: `cella ${modo === "telepatia" ? "memoria" : ""}` }, etichetta, el("p", { class: "tenue", text: t.manca }));
  const classe = (v.raccomandazione || "").replace(" ", "-");
  return el("div", { class: `cella ${modo === "telepatia" ? "memoria" : ""}` }, etichetta,
    el("p", { class: `racc ${v.raccomandazione ? classe : "nessuna"}`, text: v.raccomandazione ? t.racc[v.raccomandazione] : t.nessuna }),
    v.confrontate !== null && v.confrontate !== undefined
      ? [el("p", { class: "riga" }, v.da_trovare ? t.trovate(v.trovate, v.da_trovare) : t.nienteDaTrovare),
         v.confrontate ? el("p", { class: "riga" }, t.accordo(v.d_accordo, v.confrontate)) : null]
      : null,
    v.sigillo_integro ? null : el("p", { class: "rotto", text: t.rotto }),
    el("p", { class: "costo", text: t.costo(v.token_generati, v.secondi) }),
    el("a", { class: "apri", href: v.pagina, text: t.apri }));
}

function disegna() {
  const t = T[lingua];
  document.documentElement.lang = lingua;
  const pagina = document.getElementById("pagina");
  pagina.replaceChildren();
  const lingue = el("div", { class: "lingue", role: "group", "aria-label": t.lingue },
    ["en", "it"].map((l) => el("button", { type: "button", "aria-pressed": String(l === lingua), "data-lingua": l, text: l === "en" ? "English" : "Italiano" })));
  lingue.addEventListener("click", (e) => { const l = e.target.dataset.lingua; if (l && l !== lingua) { lingua = l; memoria.scrivi("sportello-lingua", l); disegna(); } });
  pagina.append(el("div", { class: "barra" }, el("a", { href: "../index.html", text: t.casa }), lingue));

  const voci = dati.verdetti || [];
  const usate = [...new Set(voci.map((v) => v.fonte).filter((f) => FONTI[f]))];
  pagina.append(el("header", { class: "testa" }, el("h1", { text: t.titolo }), el("p", { class: "sotto", text: t.sotto }),
    dati.registrato ? el("p", { class: "piccolo", text: t.registrato(dati.registrato) }) : null,
    usate.length ? el("p", { class: "piccolo" }, t.fonti, " ",
      usate.flatMap((f, i) => [i ? ", " : "", el("a", { href: FONTI[f], target: "_blank", rel: "noopener", text: f })]), ". ", t.fontiDopo) : null,
    el("p", { class: "piccolo", text: t.nota })));

  // Una riga per contratto, nell'ordine dei giri: telepatia e testo affiancati.
  const contratti = new Map();
  for (const v of voci) {
    const chiave = `${v.benchmark}/${v.contratto}`;
    if (!contratti.has(chiave)) contratti.set(chiave, { v, modi: {} });
    contratti.get(chiave).modi[v.modalita] = v;
  }
  const elenco = el("section", { class: "elenco", "aria-label": t.titolo },
    el("div", { class: "intestazione", "aria-hidden": "true" }, el("span", { text: t.contratto }), el("span", { class: "memoria", text: t.memoria }), el("span", { text: t.testo })));
  if (!contratti.size) elenco.append(el("p", { class: "vuoto", text: t.vuoto }));
  for (const { v, modi } of contratti.values()) {
    const fonte = NOMI_BENCHMARK[v.benchmark];
    const nome = typeof fonte === "object" ? fonte[lingua] : fonte || v.benchmark;
    elenco.append(el("article", { class: "contratto" },
      el("div", {}, el("h2", { text: v.titolo }), el("p", { class: "id", text: v.benchmark === "dimostrativo" ? t.da(nome) : `${t.da(nome)}: ${v.contratto}` })),
      cella(t, modi.telepatia, "telepatia"), cella(t, modi.testo, "testo")));
  }
  pagina.append(elenco);
  pagina.append(el("footer", { text: t.piede }));
}
disegna();
</script>
</body>
</html>
