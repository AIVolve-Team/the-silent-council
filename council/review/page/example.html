<style>
/* Verdict page (rules of “Verdict and dissent”): a document to read from the top, the recommendation first of all.
   Same fonts and colours as the judges' site: Archivo for the page, Source Serif for the words of the
   contract, one colour per expert. In Italian for the client business, in English for the judges. */
:root {
  --paper: #f6f7f9; --sheet: #ffffff; --ink: #151a30; --muted: #565d70; --line: #dcdfe6;
  --accent: #087a6d; --accent-soft: #ddf3ef;
  --legal: #2f62c8; --finance: #12a594; --risk: #7458d6;
  --sign: #1f7a4d; --sign-soft: #e3f3ea; --negotiate: #8a5208; --negotiate-soft: #fbf0dc;
  --refuse: #b42318; --refuse-soft: #fde7e4; --major: #b42318; --minor: #8a5208;
  --page-font: "Archivo", "Segoe UI", system-ui, sans-serif;
  --contract-font: "Source Serif 4", Georgia, serif;
  --code-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1324; --sheet: #161c31; --ink: #e8ebf4; --muted: #a4aabb; --line: #2b3350;
    --accent: #4fd1bf; --accent-soft: #123833; --legal: #7aa2f2; --finance: #35c2ae; --risk: #a893f2;
    --sign: #5bc48e; --sign-soft: #16301f; --negotiate: #e6b35e; --negotiate-soft: #362a14;
    --refuse: #f08a7f; --refuse-soft: #3a1a17; --major: #f08a7f; --minor: #e6b35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1324; --sheet: #161c31; --ink: #e8ebf4; --muted: #a4aabb; --line: #2b3350;
  --accent: #4fd1bf; --accent-soft: #123833; --legal: #7aa2f2; --finance: #35c2ae; --risk: #a893f2;
  --sign: #5bc48e; --sign-soft: #16301f; --negotiate: #e6b35e; --negotiate-soft: #362a14;
  --refuse: #f08a7f; --refuse-soft: #3a1a17; --major: #f08a7f; --minor: #e6b35e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.6 var(--page-font); font-variation-settings: "wdth" 100; padding-inline: 16px; padding-block: 20px 72px; }
.sheet { max-width: 920px; margin-inline: auto; display: grid; gap: 32px; }
h1, h2, h3 { line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4.2vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; font-variation-settings: "wdth" 108; overflow-wrap: anywhere; }
h2 { font-size: 1.2rem; font-weight: 740; letter-spacing: -0.01em; font-variation-settings: "wdth" 106; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 0.18em; }
button { font: inherit; color: inherit; cursor: pointer; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.muted { color: var(--muted); }
.label { font-size: 0.875rem; font-weight: 600; color: var(--muted); }

/* bar */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.bar a { font-weight: 600; font-size: 0.9375rem; text-decoration: none; }
.languages { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--sheet); margin-left: auto; }
.languages button { border: 0; background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 0.875rem; }
.languages button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* header */
.head { display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; align-items: flex-start; }
.head .titles { display: grid; gap: 10px; min-width: 0; flex: 1 1 420px; }
.seal { border: 1px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 10px 14px; display: grid; gap: 4px; min-width: 230px; color: inherit; }
.seal summary { cursor: pointer; display: grid; gap: 2px; }
.seal strong { font-size: 0.95rem; }
.seal.intact strong { color: var(--sign); }
.seal.broken { border-color: var(--refuse); background: var(--refuse-soft); }
.seal.broken strong { color: var(--refuse); }
.fingerprints { font: 0.75rem/1.5 var(--code-font); color: var(--muted); overflow-wrap: anywhere; }
.model-language { font-size: 0.9375rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }

/* recommendation */
.recommendation { background: var(--sheet); border: 1px solid var(--line); border-top: 6px solid var(--colour); border-radius: 14px; padding: 22px 24px 24px; display: grid; gap: 12px; }
.recommendation .value { font-weight: 850; font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1; letter-spacing: -0.03em; font-variation-settings: "wdth" 116; color: var(--colour); }
.recommendation.sign { --colour: var(--sign); }
.recommendation.negotiate { --colour: var(--negotiate); }
.recommendation.do-not-sign { --colour: var(--refuse); }
.recommendation .reason { max-width: 46rem; }
.red-notice { background: var(--refuse-soft); border: 2px solid var(--refuse); border-radius: 14px; padding: 20px 22px; display: grid; gap: 8px; }
.red-notice h2 { color: var(--refuse); }
.numbers { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 0.9375rem; color: var(--muted); }
.numbers b { color: var(--ink); font-variant-numeric: tabular-nums; }

.comparison { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; display: grid; gap: 6px; }
.comparison .count { font-weight: 700; font-size: 1.1rem; }
.comparison a { color: var(--ink); }

.objections { display: grid; gap: 10px; }
.objections ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* rows */
.group { display: grid; gap: 10px; }
.group > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; border-bottom: 2px solid var(--c); padding-bottom: 6px; }
.group > header h2 { display: flex; align-items: center; gap: 10px; }
.group > header h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; gap: 10px; min-width: 0; }
.row.flagged { border-left: 4px solid var(--c); }
.row .top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.row .name { font-weight: 650; }
.row .key { font-size: 0.8125rem; color: var(--muted); margin-left: 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 0.8125rem; font-weight: 600; line-height: 1; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.yes { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--ink); border-color: transparent; }
.pill.ok { color: var(--sign); }
.pill.not-found { color: var(--refuse); border-color: var(--refuse); }
.quote { margin: 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--line); font: 400 1.0625rem/1.55 var(--contract-font); color: var(--ink); overflow-wrap: anywhere; }
.rationale { color: var(--muted); }
.experts { border-radius: 8px; padding: 8px 12px; display: grid; gap: 6px; background: var(--paper); font-size: 0.9375rem; }
.experts.different { background: var(--refuse-soft); }
.experts .outcome { font-weight: 600; }
.experts.same .outcome { color: var(--sign); }
.experts.different .outcome { color: var(--refuse); }
.experts details > summary { cursor: pointer; color: var(--muted); }
.experts .quote { margin-top: 6px; }
.dissent { border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: var(--negotiate-soft); }
.dissent.major { background: var(--refuse-soft); }
.dissent .who { font-weight: 600; }
.dissent.major .who { color: var(--major); }
details.dissent > summary { cursor: pointer; font-weight: 600; color: var(--minor); }
details.dissent.major > summary { color: var(--major); }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.correction { display: grid; gap: 6px; justify-items: start; }
.correction button { font-size: 0.85rem; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 4px 10px; }
.correction button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.instruction { display: grid; gap: 6px; }
.instruction h2 { margin: 0; }
.instruction textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.person-choice textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; font: inherit; color: inherit; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.choice button { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 12px; }
.choice button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* actions and experts' notes */
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions button { border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 9px 16px; font-weight: 650; }
.actions button.secondary { background: transparent; color: var(--ink); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.note { background: var(--sheet); border: 1px solid var(--line); border-top: 3px solid var(--c, var(--line)); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 0.9375rem; }
footer { font-size: 0.875rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }
footer code { font: 0.8125rem var(--code-font); }
.load { background: var(--sheet); border: 2px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; display: grid; gap: 10px; }

/* summary to print as PDF: recommendation, flagged clauses, dissents and the person's choices */
.print-only { display: none; }
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 11pt; }
  .no-print { display: none !important; }
  .print-only { display: block; }
  .row:not(.flagged):not(.with-dissent) { display: none; }
  .row, .recommendation, .seal { border-color: #999; break-inside: avoid; }
  details.dissent > *:not(summary) { display: block; }
}
</style>

function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attributes)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "style") node.style.cssText = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c.nodeType ? c : String(c));
  return node;
}

// never javascript: or data:. The view of ?view= and the sending of the choices stay on the same site: otherwise a link
// could make the page show, on our domain, a verdict prepared by others.
const safe = (u) => {
  if (typeof u !== "string" || !u) return null;
  try { const x = new URL(u, location.href); return ["http:", "https:", location.protocol].includes(x.protocol) ? x.href : null; } catch { return null; }
};
const sameSite = (u) => {
  if (typeof u !== "string" || !u) return false;
  // The scheme is compared separately: opened from disk, the page has origin "null" like javascript: and data:.
  try { const x = new URL(u, location.href); return x.protocol === location.protocol && x.origin === location.origin; } catch { return false; }

  const container = el("div", { class: "choice", role: "group", "aria-label": t().whoIsRight });
  const options = [["expert", t().isRight(whoOf(row.dissent))], ["verdict", t().verdictIsRight]];
  for (const [value, label] of options) {
    const button = el("button", {
      type: "button",
      "aria-pressed": choices[row.key] === value ? "true" : "false",
      onclick: () => {
        choices[row.key] = value;
        saveChoices(view, choices);
        for (const b of container.querySelectorAll("button")) b.setAttribute("aria-pressed", b === button ? "true" : "false");
        updatePrint(view, choices);

    container.append(button);

  why.value = reasons[row.key] ?? "";
  why.addEventListener("input", () => { reasons[row.key] = why.value; });
  return el("div", { class: "person-choice" }, container, why);
}

      el("p", { class: "count" }, t().agreement(sourceText(c.who), c.agreed, c.compared)),
      c.to_find ? el("p", {}, t().foundCount(c.to_find, c.found)) : el("p", {}, t().nothingHere),
      el("p", { class: "muted" }, sourceText(c.explanation) ?? "", source ? [" ", el("a", { href: source, target: "_blank", rel: "noopener" }, t().source)] : null),
      el("p", { class: "muted" }, t().eachRow)) : null,
    view.objections.length ? el("section", { class: "objections" }, el("h2", {}, t().objections),
      el("ul", {}, view.objections.map(o => el("li", {}, el("b", {}, language === "en" ? o.key : o.name_it), `: ${whole(o.objection)}`)))) : null,
    ...(r ? groups : []),
    r && sending ? instructionBlock() : null,
    el("div", { class: "actions no-print" },
      notesButton,
      el("button", { type: "button", onclick: () => window.print() }, t().print),
      sending ? el("button", { type: "button", onclick: () => sendChoices(view, choices, document.getElementById("send-outcome")) }, t().send) : null,
      el("button", { type: "button", class: "secondary", onclick: () => downloadChoices(view, choices) }, t().save),
      sending ? el("span", { id: "send-outcome", role: "status", class: "muted" }) : null),
    notesPanel,
    el("section", { class: "print-only", id: "print-choices" }),
    el("footer", {}, el("span", {}, t().cost(view)), el("span", {}, t().footer[0], el("code", {}, t().footer[1]), t().footer[2])));
  updatePrint(view, choices);
  document.title = t().title(view.title);
}

function chooseLanguage(view) {
  const asked = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("council-language")); } catch { /* nothing */ }
  for (const l of [asked, saved, view.language, "it"]) if (l === "it" || l === "en") return l;
  return "it";
}

async function start() {
  const see = (view) => { language = chooseLanguage(view); show(view); };
  const embedded = JSON.parse(document.getElementById("data").textContent);
  if (embedded) return see(embedded);
  // A judge's live review (site/src/council/live.html): the view is in their browser.
  const live = new URLSearchParams(location.search).get("live");
  if (live) {
    let done = [];
    try { done = JSON.parse(localStorage.getItem("council-live")) || []; } catch { /* nothing */ }
    const item = Array.isArray(done) ? done.find(f => f && f.case_id === live) : null;
    if (item) return see(item.view);
    language = chooseLanguage({});
    document.getElementById("load").replaceChildren(el("h1", {}, capital(t().liveIndex)), el("p", { class: "muted" }, t().notHere),
      el("p", {}, el("a", { href: "live.html" }, `← ${t().liveIndex}`)));
    return;
  }
  const path = new URLSearchParams(location.search).get("view");
  if (path && sameSite(path)) {
    try { return see(await (await fetch(path)).json()); } catch (e) { console.error(e); }
  }
  document.getElementById("file").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (file) see(JSON.parse(await file.text()));
  });
}
start();
</script>
