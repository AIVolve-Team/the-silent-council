[project]
name = "motore"
version = "0.1.0"
description = "Motore telepatico: agenti Qwen3 che si passano messaggi latenti"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers==4.57.6",
    "safetensors",
    "lm-format-enforcer",
    "cryptography",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["motore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["modello: carica un Qwen3 piccolo (lento, scarica il modello la prima volta)"]
