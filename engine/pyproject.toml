[project]
name = "engine"
version = "0.1.0"
description = "Telepathic engine: Qwen3 agents that pass each other latent messages"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers>=4.57.6,<6",
    "safetensors",
    "lm-format-enforcer",
    "cryptography",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads a small Qwen3 (slow, downloads the model the first time)"]
